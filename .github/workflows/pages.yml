# Publica o site no GitHub Pages:
#   prod/  -> raiz do site (producao, https://uniquegardenmalls.com.br/)
#   v1/ v2/ v3/ -> mesmas pastas de sempre (v3 = pre-producao)
name: Publicar site

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir _site
          cp -r prod/. _site/
          for v in v1 v2 v3; do
            if [ -d "$v" ]; then cp -r "$v" "_site/$v"; fi
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
